{% extends 'base.html' %}
{% block title %}Новий пароль — TopBearing{% endblock %}
{% block content %}
<section class="auth-shell container"><div class="auth-card"><h1>Новий пароль</h1>
{% if invalid %}<div class="form-error">Посилання недійсне або вже застаріло.</div><p class="auth-bottom"><a href="/forgot-password">Створити новий запит</a></p>
{% else %}
{% if error %}<div class="form-error">{{ error }}</div>{% endif %}
<form method="post" action="/reset-password" class="form-stack"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input type="hidden" name="token" value="{{ token }}"><label>Новий пароль<input type="password" name="password" minlength="8" required></label><label>Повторіть пароль<input type="password" name="confirm_password" minlength="8" required></label><button class="primary-button" type="submit">Зберегти новий пароль</button></form>
{% endif %}</div></section>
{% endblock %}
